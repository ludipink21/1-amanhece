<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diretora 360 — Homologação</title><style>body{font-family:system-ui;background:#fff9fb;color:#2c2430;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;padding:24px}.spin{width:38px;height:38px;border:4px solid #eadfe5;border-top-color:#8f3f63;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}button{padding:10px 14px;border:0;border-radius:10px;background:#8f3f63;color:white;font-weight:700}</style></head><body><div class="box" id="box"><div class="spin"></div><strong>Carregando Diretora 360…</strong><div style="margin-top:6px;color:#756b74">Versão de homologação</div></div><script>(async()=>{try{const n=9;const parts=[];for(let i=0;i<n;i++){const r=await fetch(`./diretora360-homologacao/chunks/c${i}.txt`,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar bloco '+i+' ('+r.status+')');parts.push(await r.text())}const b64=parts.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Navegador sem suporte à descompactação necessária.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('box').innerHTML='<strong>Não foi possível abrir a homologação.</strong><div style="margin:10px 0;color:#756b74">'+String(e.message||e)+'</div><button onclick="location.reload()">Tentar novamente</button>';console.error(e)}})();</script></body></html>
